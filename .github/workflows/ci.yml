name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests and dataset validation
        run: pytest -q
      - name: Dataset rebuilds from pinned sources
        run: python scripts/build_dataset.py --check
      - name: Knowledge base rebuilds from the pinned SWC commit
        run: python scripts/build_kb.py --check
      - name: Retrieval evaluation (deterministic, no API calls)
        run: python scripts/eval_retrieval.py --out /tmp/retrieval
      - name: LLM run cost previews (no API key, no API calls)
        run: |
          python scripts/run_llm.py --dry-run
          python scripts/run_llm.py --dry-run --context both
      - name: Ablation table builds from committed results
        run: python scripts/ablation.py
      - name: Evaluation report matches committed results
        run: python scripts/evaluate.py --check

  slither-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install with Slither
        run: pip install -e ".[dev,slither]"
      - name: Tests including detector-name check
        run: pytest -q
      - name: Pinned solc binaries download and verify (plus comparison with soliditylang.org list)
        run: python -m auditor.solc
      - name: Slither runs on one contract per solc version
        run: python scripts/run_slither.py --only c01 c03 c08 c36 --out /tmp/slither-smoke
