# ---------------------------------------------------------------- bad_randomness

[[contract]]
key = "swc120-guess_the_random_number"
source = "swc"
doc = "SWC-120"
sample = "guess_the_random_number.sol"
label = "vulnerable"
role = "vulnerable_sample"
pair = ""
solc = "0.4.26"
renames = { GuessTheRandomNumberChallenge = "GuessGame" }
findings = [{ class = "bad_randomness", swc = "SWC-120", anchor = "answer = uint8(keccak256(block.blockhash(block.number - 1), now));" }]
notes = "Answer derived from public block data and stored on-chain. (The _fixed variant is excluded: still blockhash-based, and a single shared guesser slot makes it ambiguous.)"

[[contract]]
key = "swc120-old_blockhash"
source = "swc"
doc = "SWC-120"
sample = "old_blockhash.sol"
label = "vulnerable"
role = "vulnerable_sample"
pair = ""
solc = "0.4.26"
findings = [{ class = "bad_randomness", swc = "SWC-120", anchor = "bytes32 answer = blockhash(guesses[msg.sender].block);" }]
notes = "blockhash returns 0 for blocks older than 256, so guessing 0 and waiting always wins. (The _fixed variant is excluded: its new check 'block - block.number < 256' underflows, so the fix itself is broken.)"

[[contract]]
key = "swc109-crypto_roulette"
source = "swc"
doc = "SWC-109"
sample = "crypto_roulette.sol"
label = "vulnerable"
role = "vulnerable_sample"
pair = "swc109-roulette"
solc = "0.4.26"
findings = [
  { class = "other", swc = "SWC-109", anchor = "Game game;" },
  { class = "bad_randomness", swc = "SWC-120", anchor = "secretNumber = uint8(sha3(now, block.blockhash(block.number-1))) % 20 + 1;" },
]
notes = "Uninitialized storage pointer overwrites secretNumber/lastPlayed (a known honeypot). Randomness also comes from block data. SmartBugs-curated labels only the first issue."

[[contract]]
key = "swc109-crypto_roulette_fixed"
source = "swc"
doc = "SWC-109"
sample = "crypto_roulette_fixed.sol"
label = "vulnerable"
role = "fixed_sample_residual"
pair = "swc109-roulette"
solc = "0.4.26"
findings = [{ class = "bad_randomness", swc = "SWC-120", anchor = "secretNumber = uint8(sha3(now, block.blockhash(block.number-1))) % 20 + 1;" }]
notes = "Source calls it fixed for SWC-109 (memory struct), but the block-data randomness remains, so it is labeled vulnerable."

