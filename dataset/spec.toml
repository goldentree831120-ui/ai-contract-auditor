# Label spec for the P5 evaluation dataset.
#
# Every human labeling decision lives in this file. scripts/build_dataset.py reads it,
# fetches each sample from its source repo at a pinned commit, sanitizes it
# (strips comments, applies renames), locates each finding by its anchor text and
# writes dataset/contracts/*.sol + dataset/labels.json.
#
# label    : "vulnerable" or "clean" (clean = no known issue in ANY class of taxonomy.json,
#            judged against the whole taxonomy, not only the sample's own SWC entry)
# role     : vulnerable_sample | fixed_sample | negative_sample | fixed_sample_residual
#            (fixed_sample_residual = the source calls it "fixed" for one weakness,
#             but it still has another one, so it is labeled vulnerable)
# anchor   : text that must match exactly one line of the sanitized contract
#            (whitespace-insensitive); that line is the labeled location
# renames  : identifiers that state the label or class (e.g. withdrawBalance_fixed)
#            are renamed so the model cannot read the answer from a name

[sources.swc]
repo = "SmartContractSecurity/SWC-registry"
commit = "1b6227074ecd180b374e4844153afdda0332f979"
license = "MIT"
license_file = "LICENSE"

[sources.tob]
repo = "trailofbits/not-so-smart-contracts"
commit = "020dbdbde3e0c2e8de5f3944e7455e438b0995d5"
license = "Apache-2.0"
license_file = "LICENSE"

[sources.sigp]
repo = "sigp/solidity-security-blog"
commit = "a412a46e0e182e63966d3c4953b5a6119c34a1c6"
license = "CC-BY-4.0"
license_file = "LICENSE"

